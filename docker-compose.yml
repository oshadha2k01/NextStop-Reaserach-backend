version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - NODE_ENV=production
      - ML_SERVICE_URL=http://ml:5000
    depends_on:
      - ml
    restart: unless-stopped

  ml:
    build: ./ml
    ports:
      - "5000:5000"
    env_file: .env
    restart: unless-stopped
